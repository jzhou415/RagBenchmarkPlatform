  question: What are the considerations for determining the appropriate ASVS level
    based on the unique risk characteristics of an organization and how does this
    relate to the secure generation and management of initial passwords?
  query_type: multi_hop
  content_tags:
  - lookup
  expected_answer: 'Organizations are strongly encouraged to look deeply at their
    unique risk characteristics based on the nature of their business, and based upon
    that risk and business requirements determine the appropriate ASVS level.

    Verify system generated initial passwords or activation codes SHOULD be securely
    randomly generated, SHOULD be at least 6 characters long, and MAY contain letters
    and numbers, and expire after a short period of time. These initial secrets must
    not be permitted to become the long term password.'
