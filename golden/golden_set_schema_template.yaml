# =============================================================================
# Golden set schema — RagBenchmarkPlatform, Phase 1 (retrieval evaluation)
# Template v1.1. One file per split, same schema:
#   golden_dev.yaml / golden_heldout.yaml
# v1.1 changelog: added `provenance` per question (auto | spot-checked |
# human-verified) so a reader of the eval report knows how much to trust the
# ground truth. Fully auto-generated sets are the platform default; the
# human-verified label requires initials + date in `notes`.
# =============================================================================

schema_version: "1.1"

corpus:
  name: postgresql-18-manual      # public demo corpus, no privacy concerns
  source: pdf
  pages: 3156
  dev_subset: "Part VI (SQL Commands) + Appendix C (SQL Key Words)"   # question source only
  heldout_subset: "everything except the dev pages"                   # question source only
  eval_corpus: "full manual for both splits -- one embedding set, one index; dev/held-out differ only in their question sets (decision 2026-10-21)"

ingestion:
  # Ground-truth chunk references below are ONLY valid for this ingestion config.
  # Change the parser or chunker and chunk ids shift -> ground truth must be rebuilt.
  config_hash: "<IngestionConfig.config_hash() from src/config.py -- sha256 of the canonical ingestion config; stamped by chunk.py into chunk_manifest.yaml and copied here by auto_map.py>"
  parser: docling                  # docling | pymupdf | unstructured
  chunk_size: 1000
  chunk_overlap: 200

# --- Conventions used below --------------------------------------------------
# relevance (graded, for nDCG):
#   3 = chunk contains the exact answer
#   2 = directly answers most of the question
#   1 = background / useful context only
#   0 = not relevant (omit from the list)
#
# query_type (drives the BM25-vs-semantic stratification):
#   exact_term  -> rare exact terms in the question (BM25 should win)
#   paraphrase  -> natural-language / synonym phrasing (dense should win)
#   multi_hop   -> answer needs 2+ chunks combined
#
# provenance (how the ground_truth below was produced):
#   auto            -> fully LLM-generated + auto-mapped, no human review
#   spot-checked    -> in the review queue (multi-hop or ~20% sample), reviewed
#   human-verified  -> fully human-mapped or human-confirmed, initials in notes
#
# chunk_id format: p<page>_c<chunk-on-page:02d>, exactly as emitted by
# chunk.py into the ingestion manifest. `page` is kept as a
# human-verification aid and must equal the manifest's page_no.

questions:
  - id: q001
    split: dev                      # dev | heldout
    provenance: auto                # auto | spot-checked | human-verified
    question: "What is the default value of shared_buffers in PostgreSQL 18?"
    query_type: exact_term
    content_tags: [lookup]          # lookup | table | policy | aggregation
    expected_answer: "128MB"        # optional in Phase 1; required for Phase 2
    answer_span: "The default setting is 128MB"   # optional: exact text in chunk
    ground_truth:
      - chunk_id: "p128_c03"
        page: 128
        relevance: 3
      - chunk_id: "p129_c01"
        page: 129
        relevance: 1
    notes: ""                       # reviewer initials + date once human-verified

  - id: q002
    split: dev
    provenance: auto
    question: "How does PostgreSQL handle two transactions updating the same row at the same time?"
    query_type: paraphrase
    content_tags: [policy]
    expected_answer: "..."
    ground_truth:
      - chunk_id: "p455_c02"
        page: 455
        relevance: 3
    notes: ""
